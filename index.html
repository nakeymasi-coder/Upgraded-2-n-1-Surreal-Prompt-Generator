    .wrap {

      padding: 20px;
    }
    .tab-btn {

      color: white;
      border-radius: 9999px;
      padding: 14px 22px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #1d4ed8 0%, #d4af37 100%);
      color: black;
      box-shadow: 0 0 25px rgba(212,175,55,.25);
      border-color: rgba(212,175,55,.75);
    }
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
    .generator-frame {
      width: 100%;
      min-height: 1900px;
      border: 0;
      background: transparent;
      display: block;
      border-radius: 18px;
    }
    .marquee-wrap {
      overflow: hidden;
      border-top: 1px solid rgba(212,175,55,.2);
      border-bottom: 1px solid rgba(212,175,55,.2);
      background: rgba(255,255,255,.03);
      margin-top: 14px;
    }
    .marquee {
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: marquee 22s linear infinite;
      color: #f4e4bc;
      font-weight: 600;
      padding-block: 10px;
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    footer {
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 12px;
      padding: 20px 0 28px;
    }

    .side-scroll-controls {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }
    .side-scroll-btn {
      width: 56px;
      height: 56px;
      border-radius: 9999px;
      border: 1px solid rgba(212,175,55,.55);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.2), rgba(29,78,216,.88) 45%, rgba(0,0,0,.92) 100%);
      color: #f4e4bc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(29,78,216,.45), 0 0 28px rgba(212,175,55,.28), inset 0 0 18px rgba(255,255,255,.08);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      backdrop-filter: blur(8px);
    }
    .side-scroll-btn:hover {
      transform: scale(1.08);
      border-color: rgba(244,228,188,.85);
      box-shadow: 0 0 24px rgba(29,78,216,.62), 0 0 38px rgba(212,175,55,.4), inset 0 0 20px rgba(255,255,255,.12);
    }
    .side-scroll-btn:active { transform: scale(.98); }
    .side-scroll-btn svg {
      width: 22px;
      height: 22px;
      filter: drop-shadow(0 0 8px rgba(244,228,188,.45));
    }
    @media (max-width: 768px) {
      .side-scroll-controls {
        right: 12px;
        bottom: 16px;
        top: auto;
        transform: none;
      }
      .side-scroll-btn {
        width: 50px;
        height: 50px;
      }
    }

      });
    });


    const scrollUpBtn = document.getElementById('scroll-up-btn');
    const scrollDownBtn = document.getElementById('scroll-down-btn');

    if (scrollUpBtn) {
      scrollUpBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    if (scrollDownBtn) {
      scrollDownBtn.addEventListener('click', () => {
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
      });
    }
  </script>
</body>
</html>
